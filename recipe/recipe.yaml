schema_version: 1

context:
  version: "13.1"

package:
  name: pyobjc-framework-corebluetooth
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyobjc-framework-corebluetooth/pyobjc_framework_corebluetooth-${{ version }}.tar.gz
  sha256: 60de5e6818c9450f27a6526132698fc0c1a06cb88c83858a227bdd00b2009214

build:
  number: 0
  skip: linux or win
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
  host:
    - pip
    - python
    - setuptools
  run:
    - pyobjc-core >=13.0
    - pyobjc-framework-cocoa >=13.0
    - python

tests:
  - python:
      imports:
        - CoreBluetooth
      pip_check: true

about:
  summary: Wrappers for the framework CoreBluetooth on macOS
  license: MIT
  license_file:
    - LICENSE.txt
  homepage: https://github.com/ronaldoussoren/pyobjc

extra:
  recipe-maintainers:
    - jan-janssen
    - xhochy
